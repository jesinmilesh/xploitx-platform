{% extends "base.html" %}

{% block content %}
<div class="container my-5">
	<div class="row">
		<div class="col-md-8 offset-md-2">
			<div class="hud-panel text-center py-5">
				<div class="section-tag mb-3">
					<i class="fas fa-exclamation-triangle text-gold"></i> [ ANOMALY DETECTED // ERROR 404 ]
				</div>
				<h1 class="text-danger mb-2">{% trans %}File not found{% endtrans %}</h1>
				<p class="font-monospace text-muted mb-4">
					The requested coordinates do not correspond to any active mission node or data sector.
				</p>
				<a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary">
					<i class="fas fa-home me-1"></i> [ RETURN TO BASE ]
				</a>
			</div>
		</div>
	</div>
</div>
{% endblock %}
